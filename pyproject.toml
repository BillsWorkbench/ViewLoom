[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "viewloom"
version = "0.5.3"
description = "A desktop workspace for photographic composites"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
  "PySide6==6.12.0",
  "rawpy==0.27.1",
  "numpy==2.5.4",
  "opencv-python-headless==5.0.0.93",
  "tifffile==2026.10.15",
  "pillow==13.0.0",
]

[project.gui-scripts]
viewloom = "viewloom.app:main"

[tool.setuptools.packages.find]
include = ["viewloom*"]

[tool.setuptools.package-data]
viewloom = ["assets/*.svg"]
